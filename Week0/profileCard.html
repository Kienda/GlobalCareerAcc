<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title> Abdoulaye's Profile Card</title>
</head>

<body>
  <main>
    <div class="card">
      <header class="profile-header">
        <img class="profile-photo" src="img/me-real.png" alt="Portrait of Abdoulaye">
        <h1>Abdoulaye</h1>
        <h2>Aspiring Software Developer</h2>
      </header>

      <p class="profile-summary">
        I am learning to build clean, useful web experiences while growing my skills in HTML, CSS, and JavaScript.
      </p>

      <h3>Favorite Websites</h3>
      <ul class="link-list">
        <li><a href="https://www.facebook.com" target="_blank">Facebook</a></li>
        <li><a href="https://www.google.com" target="_blank">Google</a></li>
        <li><a href="https://www.instagram.com" target="_blank">Instagram</a></li>
      </ul>
    </div>

  </main>

</body>

</html>
